name: Implementer Timer

# The implementer sends this event when it stopped at the subscription's
# 5-hour limit while working on an issue here. This waits until the limit
# resets (free: this repository is public) and starts the runner again.
on:
  repository_dispatch:
    types: [implementer-timer]

permissions: {}

jobs:
  wait:
    permissions: {}
    # The implementer's branch of datashield-workflows until it is merged; then @main.
    uses: nfdi4health/datashield-workflows/.github/workflows/implementer-timer.yml@agent-suggest/feat/implementer
    with:
      runner-repository: FlorianSchw/datashield-agent-runner
    secrets:
      dispatch-app-client-id: ${{ secrets.DISPATCH_APP_CLIENT_ID }}
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
