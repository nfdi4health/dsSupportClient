name: Update DESCRIPTION Authors

on:
  pull_request:
    branches: [dev]

jobs:
  check-authors:
    permissions:
      contents: write
      pull-requests: write
    uses: nfdi4health/datashield-workflows/.github/workflows/authors-suggest.yml@v1/foundation
    with:
      datashield-type: client   # only for the usage counts
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
