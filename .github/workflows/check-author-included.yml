name: Update DESCRIPTION Authors

on:
  pull_request:
    # ready_for_review: drafts (e.g. the implementer's failed attempts) are skipped until marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

jobs:
  check-authors:
    permissions:
      contents: write
      pull-requests: write
    uses: nfdi4health/datashield-workflows/.github/workflows/authors-suggest.yml@main
    with:
      datashield-type: client   # only for the usage counts
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
