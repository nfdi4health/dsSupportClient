name: Check DESCRIPTION Authors

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']

concurrency:
  group: suggestion-commits-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  check-authors:
    permissions:
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/check-description-authors.yml@main
