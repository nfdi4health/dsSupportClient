name: Issue Triage

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

jobs:
  triage:
    permissions:
      issues: write
      id-token: write
    # The implementer's branch of datashield-workflows until it is merged
    # (bot-triaged, the disclosure section); then @main.
    uses: nfdi4health/datashield-workflows/.github/workflows/issue-triage.yml@agent-suggest/feat/implementer
    with:
      wait-minutes: 2
      datashield: true
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TRIAGE }}
