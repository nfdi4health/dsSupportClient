name: Issue Triage

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

jobs:
  triage:
    permissions:
      issues: write
      id-token: write
    uses: nfdi4health/datashield-workflows/.github/workflows/issue-triage.yml@main
    with:
      wait-minutes: 2
      datashield: true
      # Who may ask for a (repeated) triage with the label bot-triage.
      allowed-logins: FlorianSchw
      # The App the test and roxygen bots open their issues with: those get triaged too.
      triage-bots: generalactionsrunner[bot]
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TRIAGE }}
