name: Issue Triage

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]

jobs:
  triage:
    permissions:
      issues: write
      id-token: write
    uses: nfdi4health/datashield-workflows/.github/workflows/issue-triage.yml@main
    with:
      wait-minutes: 2
      allowed-logins: FlorianSchw # for bot-triage label
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_TRIAGE }}
