name: Roxygen Doc Suggestions (PR)

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']

jobs:
  suggest-docs:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/roxygen-suggest.yml@main
    with:
      anthropic-federation-rule-id: fdrl_01XXW9s2iFKveZyKKizcggit
      datashield: true
      datashield-type: client
