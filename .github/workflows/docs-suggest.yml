name: Roxygen Doc Suggestions (PR)

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']


jobs:
  suggest-docs:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/roxygen-suggest.yml@main
    with:
      datashield: true
      datashield-type: client
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_ROXYGEN }}
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
