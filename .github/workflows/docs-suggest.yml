name: Roxygen Doc Suggestions

on:
  pull_request:
    branches: [dev]
    paths: ['R/**']
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: what changed since the last review; all: every R file (a full review)'
        type: choice
        options: [changed, all]
        default: changed

jobs:
  suggest-docs:
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
      actions: read    # earlier runs: what the last review covered
      checks: read     # their annotations
    uses: nfdi4health/datashield-workflows/.github/workflows/roxygen-suggest.yml@v1/foundation
    with:
      review-scope: ${{ inputs.scope || 'changed' }}
      datashield-type: client
    secrets:
      anthropic-organization-id: ${{ secrets.ANTHROPIC_ORG_ID }}
      anthropic-service-account-id: ${{ secrets.ANTHROPIC_SVAC_ID }}
      anthropic-federation-rule-id: ${{ secrets.ANTHROPIC_FDRL_ROXYGEN }}
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@v1/foundation
