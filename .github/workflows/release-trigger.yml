# .github/workflows/release.yml in the package repo
name: Release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write


jobs:
  check:
    if: github.head_ref == 'dev'
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      r-version-list: '["release"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Writes `Closes #n` for each issue labelled next-release into this pull
  # request's description, so the merge closes them.
  link-issues:
    if: github.head_ref == 'dev'
    uses: nfdi4health/datashield-workflows/.github/workflows/release-issues.yml@main
    with:
      step: link

  on-success:
    needs: [check, link-issues]
    if: needs.check.result == 'success' && needs.link-issues.result == 'success'
    uses: nfdi4health/datashield-workflows/.github/workflows/merge-pull-request.yml@main
    with:
      pr_number: ${{ github.event.pull_request.number }}

  on-failure:
    needs: check
    if: needs.check.result == 'failure'
    uses: nfdi4health/datashield-workflows/.github/workflows/create-issue.yml@main
    with:
      pr_author: ${{ github.event.pull_request.user.login }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  trigger-release:
    needs: on-success
    if: needs.on-success.result == 'success'
    permissions:
      contents: write
    uses: nfdi4health/datashield-workflows/.github/workflows/trigger-release-publish.yml@main

  # After the merge: the closed issues get `released` instead of
  # `next-release`.
  label-released:
    needs: on-success
    if: needs.on-success.result == 'success'
    uses: nfdi4health/datashield-workflows/.github/workflows/release-issues.yml@main
    with:
      step: swap
