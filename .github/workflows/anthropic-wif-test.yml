name: anthropic-wif-test
on:
  pull_request:
        branches: [dev]
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange for an Anthropic access token
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01XXW9s2iFKveZyKKizcggit",
            "organization_id": "ab598c51-a4e1-4c60-943d-c04722aecf04",
            "service_account_id": "svac_018HwE11GfPMYQhCYUQPeDS7",
            "workspace_id": "wrkspc_01HomocfgVDvhHiT9u4sNHvK"
          }
          JSON
