name: Workflow Graphs

on:
  push:
    branches: [dev]   # where merges land; [main] in repos without dev
    paths: ['.github/workflows/**']
  pull_request:
    branches: [dev]
    paths: ['.github/workflows/**']
  workflow_dispatch:

jobs:
  workflow-graphs:
    permissions:
      contents: write
      pull-requests: write
    uses: FlorianSchw/package-workflows/.github/workflows/workflow-graphs.yml@main
    secrets:
      app-client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
