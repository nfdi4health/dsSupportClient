# .github/workflows/check.yml in the package repo
name: R CMD Check

on:
  # No paths filter: the check is required, and a required check that a
  # filter skips never reports, which blocks docs-only pull requests.
  pull_request:
    branches: [dev]
  schedule:
    - cron: '15 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      extra-apt-packages: ''
      extra-r-packages: ''
      r-version-list: '["release"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
