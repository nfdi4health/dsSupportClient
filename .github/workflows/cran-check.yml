name: CRAN check

# R CMD check the way CRAN does (as-cran: PDF manual, incoming checks) on
# the three systems CRAN checks on, with the released R and R-devel. Weekly
# and by hand; the release pull request (dev -> main) runs the same matrix
# in release-trigger.yml before it merges. Pull requests into dev keep the
# quick ubuntu check (R-CMD-check).

on:
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

jobs:
  check:
    uses: nfdi4health/datashield-workflows/.github/workflows/r-cmd-check.yml@main
    with:
      os-list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      r-version-list: '["release", "devel"]'
      as-cran: true
      run-codecov: false

  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    uses: nfdi4health/datashield-workflows/.github/workflows/workflow-keepalive.yml@main
